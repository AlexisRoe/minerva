[project]
name = "worker-core"
version = "0.1.0"
description = "Shared application frame for Minerva queue workers"
requires-python = ">=3.14"
dependencies = [
    "redis==8.1.0",
    "pydantic-settings==2.14.2",
    "structlog==26.1.0",
    "sentry-sdk==2.66.0",
]

[build-system]
requires = ["uv_build>=0.9.0,<1.0.0"]
build-backend = "uv_build"
