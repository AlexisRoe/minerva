[project]
name = "worker-core"
version = "0.1.0"
description = "Shared application frame for Minerva queue workers"
requires-python = ">=3.14"
dependencies = [
    "redis>=6.0.0",
    "pydantic-settings>=2.10.0",
    "structlog>=25.0.0",
    "sentry-sdk>=2.40.0",
]

[build-system]
requires = ["uv_build>=0.9.0,<1.0.0"]
build-backend = "uv_build"
