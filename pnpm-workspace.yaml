  # the install home; nothing in the build needs it to have run.
  '@scarf/scarf': false
  # Loads the prebuilt native binding behind @sentry/profiling-node. Skipping it
  # leaves the profiler unable to start.
  '@sentry/node-cpu-profiler': true
  '@swc/core': true
  esbuild: true
