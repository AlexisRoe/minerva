name: CI

# The gate that used to live entirely in the pre-push hook. Everything here runs
# unscoped — the whole repo, every time — because this is the check that has to be
# trustworthy. The local hook is now the fast subset; this is the slow, complete one.
#
# The five checks are independent of one another, so they run as five parallel jobs
# rather than the sequential chain `make verify` uses locally. The `ci` job at the
# bottom joins them back into the single required status check for branch protection.

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the in-flight run obsolete; cancel it. Never cancel on
# main, where each run is the record of a distinct commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: make lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          build-libs: true
      - run: make typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          build-libs: true
      - run: make test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No build-libs: `make build` builds every package in dependency order,
      # the shared libraries first.
      - uses: ./.github/actions/setup
      - run: make build

  i18n:
    name: i18n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The three catalogue checks are Python-stdlib-only and read the catalogues
      # straight off disk, so this job skips node and pnpm entirely.
      #
      # Locally these run pre-commit and only when i18n files are staged. Here they
      # run unconditionally: a bypassed hook must not be able to land a broken
      # catalogue. --verbose because a CI log has no one to ask for detail.
      - run: make verify-i18n-verbose

  # Single required status check. Branch protection points at this one job, so the
  # five above can be renamed, split or added to without touching repo settings.
  ci:
    name: ci
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, typecheck, test, build, i18n]
    steps:
      # `needs.*.result` is 'success', 'failure', 'cancelled' or 'skipped'. Asserting
      # on the set is what makes a cancelled or skipped dependency fail the gate —
      # plain `needs:` alone would let this job be skipped along with them.
      - name: Check that every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'success') && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}" = "true" ]
