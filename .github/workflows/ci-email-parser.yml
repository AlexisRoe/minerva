name: ci-email-parser

on:
  pull_request:
    paths:
      - 'apps/email-parser/**'
      - 'libs/worker-core/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'ruff.toml'
      - '.python-version'
      - '.github/workflows/ci-email-parser.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-email-parser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run ruff check apps/email-parser libs/worker-core
      - run: uv run ruff format --check apps/email-parser libs/worker-core
      - run: uv run mypy apps/email-parser/src libs/worker-core/src
      - run: uv run pytest apps/email-parser libs/worker-core

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build container image
        run: docker build -f apps/email-parser/Dockerfile .
