name: ci-libs

on:
  pull_request:
    paths:
      - 'libs/shared/**'
      - 'libs/ui/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'biome.json'
      - 'nx.json'
      - '.github/workflows/ci-libs.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-libs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx nx run-many -t lint typecheck test build --projects=@minerva/shared,@minerva/ui
      - run: npx nx run @minerva/ui:build-storybook
