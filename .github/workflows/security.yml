name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 5 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: npm ci
      # GHSA-w5hq-g745-h8pq (uuid, moderate): pulled in by webpack-dev-server -> sockjs,
      # dev-server-only tooling not exposed at runtime. sockjs@0.3.24 (latest) still hard-pins
      # uuid@^8.3.2 with no fixed release, and the only npm-suggested fix is downgrading
      # @nx/webpack to a much older major version. Drop this exclusion once sockjs (or
      # webpack-dev-server dropping it) ships a fix, or once Nx supports webpack-dev-server@6.
      #
      # axios (moderate/high, GHSA-42h9-826w-cgv3 and 9 related advisories): nx@23.1.0 pins
      # its own axios dependency to the exact vulnerable version 1.16.1 (fix is 1.18.0+).
      # nx is already on its latest release (23.1.0); `npm audit fix --force` can only offer
      # a downgrade to @nx/node@22.6.5, not an update. Drop this exclusion once Nx ships a
      # release that bumps its pinned axios.
      #
      # GHSA-3jxr-9vmj-r5cp (brace-expansion, high): same story as axios above -- nx@23.1.0
      # and several @nx/* packages pin brace-expansion to the exact vulnerable version 5.0.6
      # (fix is 5.0.7+). No newer Nx release exists to bump to. Drop this exclusion once Nx
      # ships a release that bumps its pinned brace-expansion.
      - run: npx better-npm-audit audit --level moderate --exclude 1119441,1123882,1123884,1123885,1123957,1123959,1123961,1123967,1123969,1123971,1123973,1123898

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
