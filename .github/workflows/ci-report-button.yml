name: ci-report-button

on:
  pull_request:
    paths:
      - 'apps/report-button/**'
      - 'libs/shared/**'
      - 'libs/ui/**'
      - 'tools/vite/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'biome.json'
      - 'nx.json'
      - '.github/workflows/ci-report-button.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-report-button-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx nx run report-button:lint
      - run: npx nx run report-button:typecheck
      - run: npx nx run report-button:test
      - run: npx nx run report-button:build
