name: version-bump

# Bumps the root package.json version when a PR carrying a version:* label merges into main.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: version-bump-main
  cancel-in-progress: false

jobs:
  bump:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Determine bump type from labels
        id: bump-type
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          type=""
          case " $LABELS " in
            *" version:major "*) type="major" ;;
            *" version:minor "*) type="minor" ;;
            *" version:patch "*) type="patch" ;;
          esac
          echo "type=$type" >> "$GITHUB_OUTPUT"
          if [ -z "$type" ]; then
            echo "No version:* label found — skipping version bump."
          fi

      - uses: actions/checkout@v7
        if: steps.bump-type.outputs.type != ''
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        if: steps.bump-type.outputs.type != ''
        with:
          node-version-file: .nvmrc

      - name: Bump version, commit and tag
        if: steps.bump-type.outputs.type != ''
        env:
          BUMP_TYPE: ${{ steps.bump-type.outputs.type }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          new_version=$(npm version "$BUMP_TYPE" --no-git-tag-version)
          git add package.json package-lock.json
          git commit -m "chore(release): $new_version [skip ci]"
          git tag "$new_version"
          git push origin main --follow-tags
