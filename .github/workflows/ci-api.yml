name: ci-api

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'libs/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'biome.json'
      - 'nx.json'
      - '.github/workflows/ci-api.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx nx run api:lint
      - run: npx nx run api:typecheck
      - run: npx nx run api:test
      - run: npx nx run api:build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build container image
        run: docker build -f apps/api/Dockerfile .
