[project]
name = "email-screenshot"
version = "0.1.0"
description = "Minerva worker: renders screenshots for email events"
requires-python = ">=3.14"
dependencies = ["worker-core"]

[project.scripts]
email-screenshot = "email_screenshot.main:main"

[tool.uv.sources]
worker-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.32,<1.0.0"]
build-backend = "uv_build"
