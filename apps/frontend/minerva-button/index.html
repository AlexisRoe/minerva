<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preload" as="font" type="font/ttf" href="/assets/fonts/Inter-VariableFont.ttf" crossorigin />
    <link rel="preload" as="font" type="font/ttf" href="/assets/fonts/Inter-Italic-VariableFont.ttf" crossorigin />
    <link rel="preload" as="font" type="font/ttf" href="/assets/fonts/DMSans-VariableFont.ttf" crossorigin />
    <link rel="preload" as="font" type="font/ttf" href="/assets/fonts/DMSans-Italic-VariableFont.ttf" crossorigin />

    <title>Minerva Button</title>


    <!-- Office.js overwrites history.pushState and history.replaceState with
         non-functions when it decides it is running outside an Office client,
         which is fatal to any router that reads them. This runs first and keeps
         a bound copy, so restoreHistoryApi() can put them back. Inline and
         classic on purpose: a module script would be deferred to after Office.js
         and would find the originals already gone. -->
    <script>
        (() => {
            window.__minervaHistoryApi = {
                pushState: window.history.pushState.bind(window.history),
                replaceState: window.history.replaceState.bind(window.history),
            };
        })();
    </script>

    <!-- Office.js installs the `Office` global the pane talks to Outlook
         through. It has to come from Microsoft's CDN rather than the bundle:
         the host matches the served copy against the client it is running in,
         and a self-hosted one is unsupported.

         `defer` rather than `async`: deferred scripts run in document order, so
         this one is guaranteed to have installed the global before
         /src/main.tsx (a module script, deferred by the same rules) executes,
         while neither of them blocks the splash below from painting. If the CDN
         is unreachable the global never appears, which waitForOffice() reports
         as ERR_007. -->
    <script defer src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <!-- Plain stylesheet, not part of the bundle: the splash below has to be
         painted before any JavaScript runs. Class names are prefixed to keep
         them out of Mantine's namespace. -->
    <link rel="stylesheet" href="/boot-loader.css" />

    <!-- Without scripting nothing will ever replace the splash, so the spinner
         stops promising an app that is not coming and the message below takes
         its place. -->
    <noscript>
        <style>
            .minerva-boot__spinner {
                display: none;
            }
        </style>
    </noscript>
</head>

<body>
    <!-- The splash sits inside #root, so React's first commit clears it even if
         the bootstrap's explicit removal is missed. The app cannot render until
         it has fetched /config.json, which is a network round trip.
         English only: this is shown before i18next is loaded. -->
    <div id="root">
        <div id="minerva-boot" class="minerva-boot">
            <span class="minerva-boot__spinner" role="status" aria-label="Loading Minerva"></span>
            <p id="minerva-boot-error" class="minerva-boot__message" hidden>
                Minerva could not start. Please reload the task pane, and contact support if this keeps happening.
            </p>
            <noscript>
                <p class="minerva-boot__message">Minerva needs JavaScript to run. Please enable it and reload the task
                    pane.</p>
            </noscript>
        </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
