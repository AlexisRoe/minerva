[project]
name = "minerva-workspace"
version = "0.1.0"
description = "Minerva monorepo Python workspace root (virtual)"
requires-python = ">=3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/email-parser", "apps/email-screenshot", "libs/worker-core"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "mypy==2.3.0",
    "ruff==0.16.0",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
xfail_strict = true

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
