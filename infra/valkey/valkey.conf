# Valkey — job queues, cache and the SSE fan-out for the Minerva stack.
#
# Mounted read-only at /etc/valkey/valkey.conf by infra/docker/docker-compose.yml,
# which appends `--requirepass` on the command line: the password is the one
# setting that must not live in a checked-in file.

# Caddy is not in front of this one — the api and the workers connect directly
# over the compose network, and compose publishes the port on 127.0.0.1 only.
bind 0.0.0.0
port 6379
protected-mode yes

# ---- persistence ---------------------------------------------------------
# Jobs must survive a restart, which rules out running from memory alone. The
# append-only file replays every write; `everysec` is the usual compromise —
# at most one second of accepted-but-unwritten jobs on an unclean stop.
appendonly yes
appendfsync everysec
dir /data

# RDB snapshots stay on alongside the AOF: they are what makes a restart fast,
# since Valkey loads the snapshot and replays only the tail of the log.
save 900 1
save 300 10
save 60 10000
# Refuse writes if a snapshot is failing. Silently accepting jobs that are not
# being persisted is the failure mode worth being loud about.
stop-writes-on-bgsave-error yes

# ---- eviction ------------------------------------------------------------
# BullMQ requires `noeviction` and says so: its queues are ordinary keys, and an
# evicted key is a job that vanished without ever being marked failed.
#
# The policy is server-wide, so the cache cannot have LRU while the queues have
# this — one instance means one answer. The consequence is that everything
# cached here has to carry a TTL of its own rather than relying on Valkey to
# make room, and that reaching `maxmemory` is a hard error instead of a slow
# degradation. If cache pressure ever makes that the wrong trade, the fix is a
# second Valkey for the cache, not a change to this line.
#
# @see https://docs.bullmq.io/guide/going-to-production
maxmemory-policy noeviction
# Deliberately unset: with `noeviction` a limit turns a full instance into
# failing writes, and on a development machine the container limit is the only
# ceiling worth having. Set one per deployment where memory is contended.
# maxmemory 512mb

# ---- keyspace ------------------------------------------------------------
# 16 logical databases, of which .env.template assigns three: 0 queues, 1 cache,
# 2 SSE. Convention only — Valkey does not enforce it — but it means a FLUSHDB
# while debugging the cache cannot take the job queues with it.
#
# Pub/sub is *not* database-scoped: a PUBLISH on database 2 is delivered to a
# subscriber on database 0. SSE channel names therefore have to carry their own
# prefix, which is the api's job, not this file's.
databases 16

# ---- logging -------------------------------------------------------------
# To stdout, where `make logs` can see it.
logfile ""
loglevel notice
