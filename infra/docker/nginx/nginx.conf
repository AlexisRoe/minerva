# TLS termination for the full docker-compose stack. The mkcert certificate only
# covers localhost/127.0.0.1, so services are distinguished by port, not hostname.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  ssl_certificate /etc/nginx/certs/localhost-cert.pem;
  ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;

  # NestJS API
  server {
    listen 3000 ssl;
    http2 on;

    location / {
      proxy_pass http://api:3000;
    }
  }

  # go-camo image proxy
  server {
    listen 8443 ssl;
    http2 on;

    location / {
      proxy_pass http://camo:8080;
    }
  }

  # LocalStack (S3)
  server {
    listen 4566 ssl;
    http2 on;
    client_max_body_size 100m;

    location / {
      proxy_pass http://localstack:4566;
    }
  }
}
