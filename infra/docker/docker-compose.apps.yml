name: minerva

# Overlay adding the application containers and the TLS-terminating nginx proxy.
# Always combine with the base file:
#   docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.apps.yml --env-file .env up

services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgresql://minerva_rw:${MINERVA_RW_PASSWORD:?missing MINERVA_RW_PASSWORD}@postgres:5432/${POSTGRES_DB:?missing POSTGRES_DB}?schema=public
      DATABASE_URL_RO: postgresql://minerva_ro:${MINERVA_RO_PASSWORD:?missing MINERVA_RO_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      VALKEY_URL: redis://:${VALKEY_PASSWORD:?missing VALKEY_PASSWORD}@valkey:6379/0
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?missing AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?missing AWS_SECRET_ACCESS_KEY}
      S3_ENDPOINT: http://localstack:4566
      S3_BUCKET: ${S3_BUCKET:?missing S3_BUCKET}
      CAMO_HMAC_KEY: ${CAMO_HMAC_KEY:?missing CAMO_HMAC_KEY}
      # External URL embedded in signed image links served to browsers (nginx TLS port).
      CAMO_BASE_URL: https://localhost:8443
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost:5173,https://localhost:5174}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - minerva

  email-parser:
    build:
      context: ../..
      dockerfile: apps/email-parser/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
      EVENT_STREAM: ${EVENT_STREAM:-minerva:events}
      WORKER_SENTRY_DSN: ${WORKER_SENTRY_DSN:-}
    depends_on:
      valkey:
        condition: service_healthy
    networks:
      - minerva

  email-screenshot:
    build:
      context: ../..
      dockerfile: apps/email-screenshot/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
      EVENT_STREAM: ${EVENT_STREAM:-minerva:events}
      WORKER_SENTRY_DSN: ${WORKER_SENTRY_DSN:-}
    depends_on:
      valkey:
        condition: service_healthy
    networks:
      - minerva

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
      - '127.0.0.1:8443:8443'
      - '127.0.0.1:4566:4566'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      camo:
        condition: service_started
      localstack:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-check-certificate -q -O /dev/null https://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - minerva

  # nginx owns the host ports of the HTTP services in full-stack mode; unpublish the
  # base file's plain-http mappings (`!override` replaces instead of merging).
  camo:
    ports: !override []

  localstack:
    ports: !override []
