# @minerva/api behind a Caddy reverse proxy — the api stack on its own.
#
# Start it with `make api` from the repository root, which is also the only
# place the interpolated `.env` is read from:
#
#   docker compose --env-file .env -f infra/docker/docker-compose.api.yml up
#
# Defaults to the Dockerfile's `development` target: sources are bind-mounted,
# nest rebuilds on change and the V8 inspector listens on 9229. Set
# MINERVA_API_TARGET=production to run the same stack against the runtime image.

name: minerva-api

services:
  api:
    build:
      context: ../..
      dockerfile: apps/backend/api/Dockerfile
      target: ${MINERVA_API_TARGET:-development}
    image: minerva/api:${MINERVA_API_TARGET:-development}
    restart: unless-stopped
    # node as PID 1 ignores signals it has no handler for, which would make
    # Nest's shutdown hooks (and `make api-down`) wait for the SIGKILL timeout.
    init: true
    env_file:
      - ../../.env
    environment:
      # Container-internal listen port. Nothing on the host reaches it — Caddy
      # is the only client and it comes in over the compose network — so it is
      # fixed rather than configurable. BE_API_PORT is the published one.
      API_PORT: '3000'
      # The services read unprefixed names (the api's schema lives in
      # apps/backend/api/src/plattform/environment/environment.interface.ts)
      # while .env namespaces them per service — bridge the two here. A name
      # missing or misspelled here fails the api's boot validation with the
      # offending variable named on its own line.
      SENTRY_DSN: ${BE_API_SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${BE_API_SENTRY_TRACES_SAMPLE_RATE:-0}
      SENTRY_PROFILE_SESSION_SAMPLE_RATE: ${BE_API_SENTRY_PROFILE_SESSION_SAMPLE_RATE:-0}
      SENTRY_ENABLE_LOGS: ${BE_API_SENTRY_ENABLE_LOGS:-false}
      CORS_ORIGINS: ${BE_API_CORS_ORIGINS:-}
      COOKIE_SECRET: ${BE_API_COOKIE_SECRET:-}
      # tsc's watcher never sees inotify events through a macOS/Windows bind
      # mount, so it has to poll. Drop these two on Linux to save some CPU.
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    ports:
      # Inspector only. HTTP is not published — Caddy is the way in.
      - '127.0.0.1:${BE_API_DEBUG_PORT:-9229}:9229'
    volumes:
      # Sources and the configs nest reads at startup. node_modules and dist
      # are deliberately not mounted: they belong to the image.
      - ../../apps/backend/api/src:/app/apps/backend/api/src
      - ../../apps/backend/api/nest-cli.json:/app/apps/backend/api/nest-cli.json:ro
      - ../../apps/backend/api/tsconfig.json:/app/apps/backend/api/tsconfig.json:ro
      - ../../apps/backend/api/tsconfig.build.json:/app/apps/backend/api/tsconfig.build.json:ro
      - ../../tsconfig.base.json:/app/tsconfig.base.json:ro
      - ../../tsconfig.backend.json:/app/tsconfig.backend.json:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      # First boot compiles the whole project before anything listens.
      start_period: 90s
    networks:
      - minerva-api

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # The one port that matters: what the api answers on, https://api.localhost:<it>.
      BE_API_PORT: ${BE_API_PORT:-4401}
    ports:
      - '127.0.0.1:${BE_API_PORT:-4401}:${BE_API_PORT:-4401}'
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # mkcert output from `make certs`. Missing certificates are a hard stop:
      # Caddy exits rather than silently serving something untrusted.
      - ../cert:/etc/caddy/cert:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      # End to end on purpose: TLS, the site match and the upstream all have to
      # work. `--no-check-certificate` only because the mkcert CA is trusted on
      # the host, not inside this container.
      test:
        - CMD
        - wget
        - --quiet
        - --no-check-certificate
        - '--header=Host: api.localhost'
        - -O
        - /dev/null
        - https://127.0.0.1:${BE_API_PORT:-4401}/health
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - minerva-api

volumes:
  caddy-data:
  caddy-config:

networks:
  # Own network, separate from the `minerva` one in docker-compose.yml. When
  # the api starts needing postgres/valkey, add that network here as external.
  minerva-api:
    name: minerva-api
